{% extends "base.html" %}

{% block content %}

<div class="form-box large">

    <h1>📤 Issue Book</h1>

    <p>
        Select a book and member.
    </p>


    <form method="POST">

        <label>
            Select Book
        </label>

        <select name="book_id" required>

            <option value="">
                Select Book
            </option>

            {% for book in books %}

            <option value="{{ book.book_id }}">

                {{ book.book_id }}
                -
                {{ book.title }}

            </option>

            {% endfor %}

        </select>


        <label>
            Select Member
        </label>

        <select name="member_id" required>

            <option value="">
                Select Member
            </option>

            {% for member in members %}

            <option value="{{ member.member_id }}">

                {{ member.member_id }}
                -
                {{ member.name }}

            </option>

            {% endfor %}

        </select>


        <button class="button">

            Issue Book

        </button>

    </form>

</div>

{% endblock %}
